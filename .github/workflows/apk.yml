name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'game/**']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Keep the same signing key every build (needed for in-place updates)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "No DEBUG_KEYSTORE_B64 secret: APKs will not update over each other."; fi
      - name: Build
        working-directory: app
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          APK_VERSION: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          npm run build:apk
      - uses: actions/upload-artifact@v4
        with:
          name: last6hours2-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to update server (optional)
        env:
          T: ${{ secrets.SERVER_ADMIN_TOKEN }}
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -n "$T" ] && [ -n "$SERVER_URL" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $T" --data-binary @app/android/app/build/outputs/apk/debug/app-debug.apk \
              "$SERVER_URL/admin/apk?versionCode=${{ github.run_number }}"
          else echo "Skipping server upload (no SERVER_ADMIN_TOKEN / SERVER_URL)."; fi
